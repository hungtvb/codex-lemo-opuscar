name: Package upstream Lemo-Opuscar for local use
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/package-lemo-local.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bundle actual upstream renderer and dependencies
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/lemomo-ai/lemo-opuscar.git upstream
          git -C upstream sparse-checkout set core
          cd upstream
          npm install --ignore-scripts --no-audit --no-fund --omit=optional
          git rev-parse HEAD > UPSTREAM_SHA
          tar -czf "$GITHUB_WORKSPACE/lemo-local-runtime.tar.gz" core node_modules package.json UPSTREAM_SHA
          ls -lh "$GITHUB_WORKSPACE/lemo-local-runtime.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: lemo-local-runtime
          path: lemo-local-runtime.tar.gz
          retention-days: 1
